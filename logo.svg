<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cifrarium">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e89a1c"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2440"/>
      <stop offset="1" stop-color="#0b0d18"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <!-- la C: un anello aperto a destra -->
  <path d="M45.9 22.3A17 17 0 1 0 45.9 41.7" fill="none" stroke="url(#ring)" stroke-width="7.5" stroke-linecap="round"/>
  <!-- il punto separatore -->
  <circle cx="47.5" cy="32" r="4.6" fill="#ffd27a"/>
</svg>
