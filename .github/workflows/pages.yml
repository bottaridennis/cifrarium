name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara il sito con la configurazione Firebase presa dal secret
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::error::Manca il secret FIREBASE_CONFIG (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p _site
          cp index.html app.js game.js social.js style.css logo.svg apple-touch-icon.png icon-512.png manifest.webmanifest _site/
          node -e '
            const c = JSON.parse(process.env.FIREBASE_CONFIG);
            require("fs").writeFileSync("_site/firebase-config.js", "export const firebaseConfig = " + JSON.stringify(c) + ";\n");
          '

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
